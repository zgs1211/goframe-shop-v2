# 本地开发环境依赖：MySQL + Redis
# 启动：docker compose -f docker-compose.dev.yml up -d
# 停止：docker compose -f docker-compose.dev.yml down
services:
  mysql:
    image: mysql:8.0
    container_name: shop-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "111111"
      MYSQL_DATABASE: "shop"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - shop-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p111111"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: shop-redis
    ports:
      - "6379:6379"

volumes:
  shop-mysql-data:
